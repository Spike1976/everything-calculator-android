plugins { id 'com.android.application' }

android {
    namespace 'com.michaelstokes.everythingcalculator'
    compileSdk 35
    defaultConfig {
        applicationId 'com.michaelstokes.everythingcalculator'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.6.0'
    }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}
